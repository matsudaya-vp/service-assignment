<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>接客サービスの担当割り</title></head><body>
<div id="assignee-wizard" aria-label="担当者選択プロトタイプ" style="box-sizing:border-box">
  <header>
    <div id="aw-header-title"></div>
    <div class="aw-header-meta">
      <span class="aw-date-label" id="aw-date" hidden></span>
      <div id="aw-header-actions"></div>
      <span id="aw-status" role="status" hidden></span>
    </div>
  </header>
  <div id="aw-content"></div>
  <dialog id="aw-return-dialog" aria-labelledby="aw-return-title">
    <h3 id="aw-return-title">未保存の変更があります</h3>
    <p>変更を破棄してトップへ戻りますか？</p>
    <div class="aw-actions">
      <button type="button" data-action="cancel-home" autofocus>入力を続ける</button>
      <button type="button" data-action="discard-home">変更を破棄して戻る</button>
    </div>
  </dialog>
</div>

rgin-bottom:14px;background:var(--aw-fill);border-left:4px solid var(--aw-green)}#assignee-wizard .aw-saved strong{font-weight:500}#assignee-wizard .aw-empty{color:var(--aw-muted)}

<script>
(()=>{
 const root=document.getElementById('assignee-wizard');const data=JSON.parse(document.getElementById('aw-source').textContent);const tasks=data.tasks;const empty=()=>Object.fromEntries(tasks.map(t=>[t.id,{main:'ーー',sub:'ーー'}]));
 const groups=['ミーティング前の業務','共通業務','リネン','ベッドメイク','客室点検','清掃業務'];
 const makeUnits=()=>groups.flatMap(group=>{
  const items=tasks.filter(task=>task.group===group);
  if(items[0]?.id.startsWith('floor-'))return [{name:group,group:'フロア別',items}];
  return items.map(task=>({name:task.name,group,items:[task]}));
 });
 let units=makeUnits();
 const shifts=[['早番',8],['遅出',8],['中抜',6],['9時出',4],['フロント',2]];
 const frontIndex=shifts.length-1;
 const emptyAttendance=()=>shifts.map(()=>[]);
 let activeShift=0;
 const availablePeople=()=>['ーー',...data.people.filter(person=>state.attendance.slice(0,frontIndex).some(list=>list.includes(person)))];
 let target=null;
 let state={step:0,view:'start',date:null,draft:empty(),attendance:emptyAttendance(),saved:null};
 const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const main=root.querySelector('#aw-content');const date=root.querySelector('#aw-date');const status=root.querySelector('#aw-status');
 const headerTitle=root.querySelector('#aw-header-title');
 const headerActions=root.querySelector('#aw-header-actions');
 const returnDialog=root.querySelector('#aw-return-dialog');
 let monitor=new URLSearchParams(location.search).get('view')==='monitor';
 const {clientId,apiUrl}=window.assignmentConfig||{};
 const rememberedKey='service-assignment-registration';
 let session=readRegistration();
 function readRegistration(){
  try {
   const saved=JSON.parse(localStorage.getItem(rememberedKey)||'null');
   return saved?.expires>Date.now()&&typeof saved.session==='string'?saved.session:null;
  } catch (_) { return null; }
 }
 function rememberRegistration(registration){
  session=registration?.session||null;
  try {
   if(session)localStorage.setItem(rememberedKey,JSON.stringify(registration));
   else localStorage.removeItem(rememberedKey);
  } catch (_) {}
 }
 const oauthStateKey='assignment-oauth-request';
 const redirectUri=location.origin+location.pathname;
 const base64url=bytes=>btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const randomKey=()=>base64url(crypto.getRandomValues(new Uint8Array(32)));
 async function beginSignIn(){
  if(!clientId||!apiUrl)throw new Error('Googleログインの設定を確認してください。');
  const state=randomKey(), verifier=randomKey();
  const challenge=base64url(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))));
  sessionStorage.setItem(oauthStateKey,JSON.stringify({state,verifier,monitor}));
  const params=new URLSearchParams({
   client_id:clientId,redirect_uri:redirectUri,response_type:'code',
   scope:'openid email',state,code_challenge:challenge,code_challenge_method:'S256'
  });
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+params);
 }
 async function request(action,payload){
  const response=await fetch(apiUrl,{
   method:'POST',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',
   body:JSON.stringify({action,payload,session}),
   signal:AbortSignal.timeout(30000)
  });
  if(!response.ok)throw new Error('接続に失敗しました。もう一度お試しください。');
  const result=await response.json();
  if(result.code==='SIGN_IN')rememberRegistration(null);
  if(result.registration)rememberRegistration(result.registration);
  if(!result.ok)throw new Error(result.message||'処理できませんでした。');
  return result.data;
 }
 function renderSignIn(){
  main.innerHTML='<button type="button" class="aw-primary">Googleでログイン</button>';
  main.firstElementChild.addEventListener('click',()=>beginSignIn().catch(showError));
 }
 async function completeSignIn(params){
  const previous=JSON.parse(sessionStorage.getItem(oauthStateKey)||'null');
  sessionStorage.removeItem(oauthStateKey);
  monitor=previous?.monitor===true;
  history.replaceState(null,'',redirectUri+(monitor?'?view=monitor':''));
  if(!previous||!params.get('code')||params.get('state')!==previous.state){
   throw new Error('Googleログインをやり直してください。');
  }
  main.textContent='Googleアカウントを確認しています…';
  const result=await request('login',{code:params.get('code'),verifier:previous.verifier});
  rememberRegistration(result);
  if(monitor)connect(availableDates()[0]);
  else render();
 }
 let busy=false;
 let revision=null;
 let savedInput='';
 let completionWrites=0;
 let completionVersion=0;
 let refreshingList=false;
 const inputSnapshot=()=>JSON.stringify([state.attendance,state.draft]);
 const homeButton='<button type="button" data-action="home">トップへ戻る</button>';
 function returnHome(){
  state={step:0,view:'start',date:null,draft:empty(),attendance:emptyAttendance(),saved:null};
  savedInput='';
  revision=null;
  target=null;
  activeShift=0;
  render();
  main.querySelector('[data-start]')?.focus();
 }
 function showError(error){
  busy=false;
  if(!session){
    root.dataset.layout='';
    renderSignIn();
  }
  else render();
  const alert=document.createElement('p');
  alert.className='aw-error';
  alert.setAttribute('role','alert');
  alert.textContent=error?.message||'通信に失敗しました。再度お試しください。';
  (main.querySelector('.aw-edit-body')??main).prepend(alert);
 }
 function connect(date,intent='assign'){
  root.dataset.day=date===availableDates()[1]?'tomorrow':'today';
  busy=true;
  render();
  request('load',{date}).then(result=>{
    data.people=result.people;
    data.front=result.front;
    tasks.forEach(task=>{
      const label=result.labels[task.id];
      task.name=task.id.startsWith('floor-')?label+' '+task.group:label;
    });
    units=makeUnits();
    revision=result.revision;
    state={...state,date,step:0,view:intent==='view'?'view':'attendance',directReview:intent==='view',attendance:uniqueAttendance(result.attendance),draft:result.assignments,completion:result.completion??{}};
    if(intent==='view')state.saved={date,assignments:structuredClone(state.draft)};
    savedInput=inputSnapshot();
    busy=false;
    render();
  }).catch(showError);
 }
 function save(){
  if(busy)return;
  const assignments=structuredClone(state.draft);
  Object.values(assignments).forEach(keepPrimaryOnly);
  const payload={date:state.date,revision,attendance:state.attendance,assignments};
  busy=true;
  render();
  request('save',payload).then(result=>{
    revision=result.revision;
    state.draft=assignments;
    state.saved={date:state.date,assignments:structuredClone(assignments)};
    savedInput=inputSnapshot();
    state.view='saved';
    busy=false;
    render();
  }).catch(showError);
 }
 function options(v){return availablePeople().map(p=>`<option${v===p?' selected':''}>${esc(p)}</option>`).join('');}
 function table(list,editable,assignments=state.saved?.assignments,floors=false,heading=floors?'階':'業務',completion=null){
  return `<table${completion?' class="aw-with-completion"':''}><thead><tr><th scope="col">${esc(heading)}</th><th scope="col">主担当</th><th scope="col">副担当</th>${completion?'<th scope="col">完了</th>':''}</tr></thead><tbody>${list.map(t=>{const v=(editable?state.draft:assignments)[t.id];return `<tr${completion?.[t.id]?' class="aw-completion-done"':''}><th scope="row">${esc(floors?t.name.split(' ')[0]:t.name)}</th>${['main','sub'].map(role=>`<td>${editable?`<select aria-label="${esc(t.name)}の${role==='main'?'主担当':'副担当'}" data-id="${t.id}" data-edit="${role}">${options(v[role])}</select>`:esc(v[role])}</td>`).join('')}${completion?completionCell(t,completion):''}</tr>`;}).join('')}</tbody></table>`;
 }
 function completionCell(task,values){
  if(!Object.hasOwn(values,task.id))return '<td class="aw-completion">—</td>';
  return `<td class="aw-completion"><label><input type="checkbox" data-completion="${task.id}" aria-label="${esc(task.name)}の完了"${values[task.id]?' checked':''}></label></td>`;
 }
 function completionCount(){
  const values=Object.values(state.completion);
  return `完了 ${values.filter(Boolean).length} / ${values.length}件`;
 }
 async function changeCompletion(box){
  const current=state;
  const id=box.dataset.completion;
  const note=main.querySelector('#aw-completion-status');
  const previous=current.completion[id];
  box.disabled=true;
  completionWrites++;
  completionVersion++;
  note.textContent='保存中…';
  try {
    const result=await request('completion',{date:current.date,id,checked:box.checked});
    current.completion[id]=result.checked;
    if(current!==state||!box.isConnected)return;
    box.checked=result.checked;
    box.closest('tr').classList.toggle('aw-completion-done',result.checked);
    main.querySelector('#aw-completion-count').textContent=completionCount();
    note.textContent='保存済';
  }catch(error){
    if(current!==state||!box.isConnected)return;
    box.checked=previous;
    note.textContent=error.message||'保存できませんでした。';
  }finally{
    completionWrites--;
    box.disabled=false;
  }
 }
 async function refreshAssignmentList(){
  if(!session||state.view!=='view'||busy||refreshingList||completionWrites||document.hidden)return;
  const current=state;
  const version=completionVersion;
  refreshingList=true;
  try {
    const result=await request('load',{date:current.date});
    if(current!==state||state.view!=='view'||busy||completionWrites||version!==completionVersion)return;
    const completion=result.completion??{};
    if(revision===result.revision&&JSON.stringify(completion)===JSON.stringify(current.completion))return;
    const scrollTop=main.querySelector('.aw-edit-body').scrollTop;
    const focused=document.activeElement;
    const focusKey=focused?.dataset.completion;
    const focusAction=focused?.dataset.action;
    data.people=result.people;
    data.front=result.front;
    tasks.forEach(task=>{
      const label=result.labels[task.id];
      task.name=task.id.startsWith('floor-')?label+' '+task.group:label;
    });
    units=makeUnits();
    current.attendance=uniqueAttendance(result.attendance);
    current.draft=result.assignments;
    current.saved={date:current.date,assignments:structuredClone(result.assignments)};
    current.completion=completion;
    revision=result.revision;
    savedInput=inputSnapshot();
    render();
    main.querySelector('.aw-edit-body').scrollTop=scrollTop;
    const replacement=focusKey?root.querySelector(`[data-completion="${focusKey}"]`)
      :focusAction?headerActions.querySelector(`[data-action="${focusAction}"]`):null;
    replacement?.focus({preventScroll:true});
  }catch(error){
    if(current===state&&state.view==='view'&&version===completionVersion){
      const note=main.querySelector('#aw-completion-status');
      if(note)note.textContent=error.message||'最新の一覧を取得できませんでした。';
    }
  }finally{
    refreshingList=false;
  }
 }
 function keepPrimaryOnly(assignment){
  if(assignment.main===assignment.sub)assignment.sub='ーー';
 }
 function assignPerson(task,role,person){
  const assignment=state.draft[task];
  assignment[role]=person;
  keepPrimaryOnly(assignment);
 }
 const roleName=role=>role==='main'?'主担当':'副担当';
 function personList(task,role,label){
  return `<section class="aw-person-panel" data-role="${role}" aria-label="${esc(label)}"><h4 aria-live="polite">${esc(label)}</h4><div class="aw-names">${availablePeople().map(person=>{
    const selected=state.draft[task.id][role]===person;
    return `<button type="button" data-person="${esc(person)}" data-task="${task.id}" data-role="${role}" aria-pressed="${selected}">${esc(person)}</button>`;
  }).join('')}</div></section>`;
 }
 function assignmentControls(unit){
  if(unit.items.length===1){
    const [task]=unit.items;
    return ['main','sub'].map(role=>personList(task,role,roleName(role))).join('');
  }
  if(!unit.items.some(task=>task.id===target?.id))target={id:unit.items[0].id,role:'main'};
  const active=unit.items.find(task=>task.id===target.id);
  const floor=task=>task.name.split(' ')[0];
  const rows=unit.items.map(task=>`<tr data-active="${task.id===target.id}"><th scope="row">${floor(task)}</th>${['main','sub'].map(role=>{
    const selected=task.id===target.id&&role===target.role;
    return `<td><button type="button" data-slot="${task.id}" data-role="${role}" aria-label="${floor(task)}の${roleName(role)} ${esc(state.draft[task.id][role])}" aria-pressed="${selected}">${esc(state.draft[task.id][role])}</button></td>`;
  }).join('')}</tr>`).join('');
  return `<table class="aw-floor-table" data-role="${target.role}"><thead><tr><th>階</th><th data-role="main">主担当</th><th data-role="sub">副担当</th></tr></thead><tbody>${rows}</tbody></table>${personList(active,target.role,floor(active)+'の'+roleName(target.role)+'を選択中')}`;
 }
 function stepMarkers(){
  return `<span class="aw-progress" aria-hidden="true">${units.map((_,index)=>{
    const position=index===state.step?'current':index<state.step?'past':'ahead';
    return `<span class="aw-dot" data-position="${position}"></span>`;
  }).join('')}</span>`;
 }
 function renderBoard(){
  const assignments=state.saved?.assignments ?? state.draft;
  const ordinary=tasks.filter(t=>!t.id.startsWith('floor-'));
  const section=(group,list,floors=false)=>`<section><h4>${esc(group)}</h4>${table(list,false,assignments,floors)}</section>`;
  main.innerHTML=`<h3 class="aw-board-title">担当一覧</h3>
    <div class="aw-board-layout"><div class="aw-board-groups">${[...new Set(ordinary.map(t=>t.group))].map(g=>section(g,ordinary.filter(t=>t.group===g))).join('')}</div>
    <h4 class="aw-floor-title">フロア別の準備担当</h4>
    <div class="aw-board-floors">${units.filter(u=>u.items.length>1).map(u=>section(u.name,u.items,true)).join('')}</div></div>`;
 }
 const tokyoDate=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'});
 function availableDates(){
  const now=Date.now();
  return [now,now+86400000].map(value=>tokyoDate.format(value).replaceAll('/','-'));
 }
 function renderStart(){
  const dates=availableDates();
  const section=(intent,title)=>`<section aria-labelledby="aw-home-${intent}"><h3 id="aw-home-${intent}">${title}</h3><div class="aw-start-options">${['今日','明日'].map((label,index)=>`
    <button type="button" data-start="${dates[index]}" data-start-day="${index?'tomorrow':'today'}" data-intent="${intent}" aria-label="${title}、${label} ${dates[index].replaceAll('-','/')}"><strong>${label}</strong><span>${dates[index].replaceAll('-','/')}</span></button>
  `).join('')}</div></section>`;
  main.innerHTML=`<div class="aw-home">${section('assign','担当を割り付ける')}${section('view','担当を確認する')}</div>`;
 }
 function unavailableAssignments(){
  const candidates=new Set(availablePeople());
  return Object.values(state.draft).flatMap(assignment=>['main','sub']
    .filter(role=>!candidates.has(assignment[role])).map(role=>[assignment,role]));
 }
 function otherServiceShift(person){
  if(activeShift===frontIndex)return -1;
  return state.attendance.findIndex((list,index)=>index<frontIndex&&index!==activeShift&&list.includes(person));
 }
 function renderAttendance(){
  const [label,limit]=shifts[activeShift];
  const selected=state.attendance[activeShift];
  const roster=activeShift===frontIndex?data.front:data.people;
  main.innerHTML=`<div class="aw-edit-body">
    <div class="aw-attendance">
      <div class="aw-shifts" aria-label="勤務区分">${shifts.map(([name,capacity],index)=>`
        <button type="button" data-shift="${index}" aria-pressed="${activeShift===index}"><strong>${name}</strong><span>${state.attendance[index].length} / ${capacity}名</span></button>
      `).join('')}</div>
      <section class="aw-person-panel"><h4>${label}の出勤者</h4><div class="aw-names">${roster.map((person,index)=>{
        const checked=selected.includes(person);
        const other=otherServiceShift(person);
        const disabled=other>=0||(!checked&&selected.length>=limit);
        const detail=other>=0?`<small>${shifts[other][0]}で選択済</small>`:'';
        return `<button type="button" data-attendee="${index}" aria-pressed="${checked}" ${disabled?'disabled':''}>${esc(person)}${detail}</button>`;
      }).join('')}</div></section>
    </div></div>
    <div class="aw-attendance-footer">${unavailableAssignments().length?'<span>出勤者から外れた方の担当は「ーー」に戻ります。</span>':''}<button type="button" class="aw-primary" data-action="finish-attendance">業務の担当割りへ</button></div>`;
 }
 function render(){
  const board=monitor;
  root.dataset.mode=board?'board':'input';
  root.dataset.layout=!board&&state.date?'tablet':'';
  headerTitle.textContent='';
  headerActions.textContent='';
  status.hidden=!board;
  const shownDate=(board?state.saved?.date:null)??state.date;
  date.hidden=!shownDate;
  const dayLabel=board?'対象日':root.dataset.day==='tomorrow'?'明日':'本日';
  date.textContent=shownDate?dayLabel+'　'+shownDate.replaceAll('-','/'):'';
  date.closest('header').hidden=!board&&!shownDate;
  if(busy){main.innerHTML='<p role="status">処理中です…</p>';return;}
  if(board){


    status.textContent='閲覧専用';
    renderBoard();
    return;
  }
  if(state.view==='start'){renderStart();return;}
  if(state.view==='attendance'){
    headerTitle.innerHTML='<h3>出勤者を選ぶ</h3><span class="aw-step">担当割りの準備</span>';
    headerActions.innerHTML=homeButton;
    renderAttendance();
    return;
  }
  if(state.view==='wizard'){
    const unit=units[state.step];
    headerTitle.innerHTML=`<h3>${esc(unit.name)}</h3><span class="aw-step" aria-live="polite">${esc(unit.group)} <strong class="aw-step-count">${state.step+1} / ${units.length}</strong></span>`;
    headerActions.innerHTML=homeButton+'<button type="button" data-action="review">一覧で確認・修正</button>';
    main.innerHTML=`<div class="aw-edit-body"><div class="aw-floor-grid">${assignmentControls(unit)}</div></div><div class="aw-footer"><button type="button" data-action="back">前へ</button>${stepMarkers()}<button type="button" class="aw-primary" data-action="next">${state.step===units.length-1?'決定して一覧へ':'決定して次へ'}</button></div>`;
    return;
  }
  const saved=state.view==='saved';
  const readOnly=saved||state.view==='view';
  const assignments=readOnly?state.saved.assignments:state.draft;
  const unassigned=tasks.filter(task=>assignments[task.id].main==='ーー').length;
  headerTitle.innerHTML=`<h3>${saved?'確定後の担当表':'担当一覧'}</h3><span class="aw-step">${readOnly?'保存済みの担当':'確認・修正'}</span>`;
  headerActions.innerHTML=homeButton+(readOnly?'<button type="button" data-action="edit">一覧を修正</button>':state.directReview?'':'<button type="button" data-action="resume">担当選択に戻る</button>');
  const reviewSection=group=>{
    const list=tasks.filter(task=>task.group===group);
    const floors=list[0]?.id.startsWith('floor-');
    return `<section class="aw-section" aria-label="${esc(group)}">${table(list,!readOnly,assignments,floors,group,state.view==='view'?state.completion:null)}</section>`;
  };
  const summary=state.view==='view'?`<strong id="aw-completion-count" aria-live="polite">${completionCount()}</strong>　<span id="aw-completion-status" role="status"></span>`:`${tasks.length}業務　／　主担当未選択 ${unassigned}件`;
  main.innerHTML=`<div class="aw-edit-body">${saved?'<div class="aw-saved"><strong>スプレッドシートに保存しました</strong></div>':''}<p>${summary}</p><div class="aw-review">${[[groups[0],groups[5],groups[1]],groups.slice(2,5)].map(gs=>`<div>${gs.map(reviewSection).join('')}</div>`).join('')}</div></div><div class="aw-attendance-footer">${readOnly?'':'<button type="button" class="aw-primary" data-action="save">担当を確定</button>'}</div>`;
 }
 root.addEventListener('click',e=>{
  const start=e.target.closest('[data-start]');
  if(start&&state.view==='start'&&!busy){
    const chosen=start.dataset.start;
    if(!availableDates().includes(chosen)){renderStart();return;}
    connect(chosen,start.dataset.intent);
    return;
  }
  const shift=e.target.closest('[data-shift]');
  if(shift&&state.view==='attendance'){
    activeShift=Number(shift.dataset.shift);
    render();
    root.querySelector('[data-shift][aria-pressed=true]')?.focus();
    return;
  }
  const attendee=e.target.closest('[data-attendee]');
  if(attendee&&state.view==='attendance'){
    const index=Number(attendee.dataset.attendee);
    const person=(activeShift===frontIndex?data.front:data.people)[index];
    const list=state.attendance[activeShift];
    if(list.includes(person))state.attendance[activeShift]=list.filter(name=>name!==person);
    else if(otherServiceShift(person)<0&&list.length<shifts[activeShift][1])list.push(person);
    render();
    root.querySelector(`[data-attendee="${index}"]`)?.focus();
    return;
  }
  const slot=e.target.closest('[data-slot]');
  if(slot){
    const {slot:id,role}=slot.dataset;
    target={id,role};
    render();
    root.querySelector(`[data-slot="${id}"][data-role="${role}"]`)?.focus();
    return;
  }
  const choice=e.target.closest('[data-person]');
  if(choice){
    const {task,role,person}=choice.dataset;
    assignPerson(task,role,person);
    render();
    root.querySelector(`[data-task="${task}"][data-role="${role}"][aria-pressed=true]`)?.focus();
    return;
  }
  const a=e.target.closest('[data-action]')?.dataset.action;
  if(!a||busy)return;
  if(a==='home'){
    if(inputSnapshot()===savedInput)returnHome();
    else returnDialog.showModal();
    return;
  }
  if(a==='cancel-home'||a==='discard-home'){
    returnDialog.close();
    if(a==='discard-home')returnHome();
    return;
  }
  if(a==='back'){
    if(state.step===0)state.view='attendance';
    else state.step--;
  }
  if(a==='finish-attendance'){
    for(const [assignment,role] of unavailableAssignments())assignment[role]='ーー';
    state.view='wizard';
  }if(a==='next'){if(state.step<units.length-1)state.step++;else state.view='review';}if(a==='review'||a==='edit')state.view='review';if(a==='resume')state.view='wizard';if(a==='save'){save();return;}render();});
 root.addEventListener('change',e=>{
  if(e.target.matches('[data-completion]')&&state.view==='view'){
    changeCompletion(e.target);
    return;
  }
  if(!e.target.matches('[data-edit]'))return;
  const {id,edit:role}=e.target.dataset;
  const scrollTop=main.querySelector('.aw-edit-body').scrollTop;
  assignPerson(id,role,e.target.value);
  render();
  main.querySelector('.aw-edit-body').scrollTop=scrollTop;
  root.querySelector(`[data-id="${id}"][data-edit="${role}"]`)?.focus({preventScroll:true});
 });
 function uniqueAttendance(attendance=emptyAttendance()){
  const assigned=new Set();
  return attendance.map((list,index)=>index===frontIndex?list:list.filter(person=>{
    if(assigned.has(person))return false;
    assigned.add(person);
    return true;
  }));
 }
 const params=new URLSearchParams(location.search);
 setInterval(refreshAssignmentList,15000);
 document.addEventListener('visibilitychange',refreshAssignmentList);
 window.addEventListener('focus',refreshAssignmentList);
 if(params.has('code')||params.has('error'))completeSignIn(params).catch(showError);
 else if(!session)renderSignIn();
 else if(monitor)connect(availableDates()[0]);
 else render();
})();
</script>
