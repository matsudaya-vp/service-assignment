<script id="aw-source" type="application/json">{"tasks":[{"id":"task-13","group":"ミーティング前の業務","name":"朝刊"},{"id":"task-14","group":"ミーティング前の業務","name":"パントリー掃除"},{"id":"task-15","group":"ミーティング前の業務","name":"アメニティ補充"},{"id":"task-16","group":"ミーティング前の業務","name":"おしぼり補充"},{"id":"task-17","group":"ミーティング前の業務","name":"風呂そうじ"},{"id":"task-18","group":"ミーティング前の業務","name":"ベッドメイク"},{"id":"task-20","group":"共通業務","name":"庭園入口清掃"},{"id":"task-21","group":"共通業務","name":"つくばい掃除"},{"id":"task-22","group":"共通業務","name":"ロクシタン補充"},{"id":"task-23","group":"共通業務","name":"ラウンジ準備"},{"id":"task-24","group":"共通業務","name":"ドリンク補充"},{"id":"task-25","group":"共通業務","name":"化粧水補充"},{"id":"floor-13-27","group":"リネン","name":"1階 リネン"},{"id":"floor-13-34","group":"ベッドメイク","name":"1階 ベッドメイク"},{"id":"floor-13-41","group":"客室点検","name":"1階 客室点検"},{"id":"floor-14-27","group":"リネン","name":"2階 リネン"},{"id":"floor-14-34","group":"ベッドメイク","name":"2階 ベッドメイク"},{"id":"floor-14-41","group":"客室点検","name":"2階 客室点検"},{"id":"floor-15-27","group":"リネン","name":"3階 リネン"},{"id":"floor-15-34","group":"ベッドメイク","name":"3階 ベッドメイク"},{"id":"floor-15-41","group":"客室点検","name":"3階 客室点検"},{"id":"floor-16-27","group":"リネン","name":"4階 リネン"},{"id":"floor-16-34","group":"ベッドメイク","name":"4階 ベッドメイク"},{"id":"floor-16-41","group":"客室点検","name":"4階 客室点検"},{"id":"floor-17-27","group":"リネン","name":"5階 リネン"},{"id":"floor-17-34","group":"ベッドメイク","name":"5階 ベッドメイク"},{"id":"floor-17-41","group":"客室点検","name":"5階 客室点検"},{"id":"floor-18-27","group":"リネン","name":"6階 リネン"},{"id":"floor-18-34","group":"ベッドメイク","name":"6階 ベッドメイク"},{"id":"floor-18-41","group":"客室点検","name":"6階 客室点検"},{"id":"clean-21","group":"清掃業務","name":"快活楼"},{"id":"common-21","group":"共通業務","name":"お茶出し"},{"id":"clean-22","group":"清掃業務","name":"錦旗"},{"id":"common-22","group":"共通業務","name":"客室案内"},{"id":"clean-23","group":"清掃業務","name":"花柏の湯"},{"id":"common-23","group":"共通業務","name":"朝お見送り"},{"id":"clean-24","group":"清掃業務","name":"維新の湯"}],"people":[],"front":[]}</script>
<script>
(()=>{
 const root=document.getElementById('assignee-wizard');const data=JSON.parse(document.getElementById('aw-source').textContent);const tasks=data.tasks;const empty=()=>Object.fromEntries(tasks.map(t=>[t.id,{main:'ーー',sub:'ーー'}]));
 const groups=['ミーティング前の業務','共通業務','リネン','ベッドメイク','客室点検','清掃業務'];
 const makeUnits=()=>groups.flatMap(group=>{
  const items=tasks.filter(task=>task.group===group);
  if(items[0]?.id.startsWith('floor-'))return [{name:group,group:'フロア別',items}];
  return items.map(task=>({name:task.name,group,items:[task]}));
 });
 let units=makeUnits();
 const shifts=[['早番',8],['遅出',8],['中抜',6],['9時出',4],['フロント',2]];
 const frontIndex=shifts.length-1;
 const emptyAttendance=()=>shifts.map(()=>[]);
 let activeShift=0;
 const availablePeople=()=>['ーー',...data.people.filter(person=>state.attendance.slice(0,frontIndex).some(list=>list.includes(person)))];
 let target=null;
 let state={step:0,view:'start',date:null,draft:empty(),attendance:emptyAttendance(),saved:null};
 const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const main=root.querySelector('#aw-content');const date=root.querySelector('#aw-date');const status=root.querySelector('#aw-status');
 const monitor=new URLSearchParams(location.search).get('view')==='monitor';
 let accessToken='';
 let tokenExpiresAt=0;
 function authorize(){
  const config=window.assignmentConfig;
  if(!config?.clientId||!config?.apiUrl) return Promise.reject(new Error('接続設定が未登録です。管理者に確認してください。'));
  if(accessToken&&Date.now()<tokenExpiresAt)return Promise.resolve(accessToken);
  return new Promise((resolve,reject)=>{
    if(!window.google?.accounts?.oauth2){reject(new Error('Googleログインを読み込めませんでした。画面を開き直してください。'));return;}
    google.accounts.oauth2.initTokenClient({
      client_id:config.clientId,
      scope:'openid email',
      callback:result=>{
        if(!result.access_token){reject(new Error('Googleログインを完了できませんでした。'));return;}
        accessToken=result.access_token;
        tokenExpiresAt=Date.now()+Math.max(0,Number(result.expires_in)-30)*1000;
        resolve(accessToken);
      },
      error_callback:()=>reject(new Error('Googleログインを完了できませんでした。'))
    }).requestAccessToken();
  });
 }
 async function request(action,payload){
  const token=await authorize();
  const response=await fetch(window.assignmentConfig.apiUrl,{
    method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},credentials:'omit',
    body:JSON.stringify({action,payload,accessToken:token})
  });
  if(!response.ok)throw new Error('シートに接続できませんでした。');
  const result=await response.json();
  if(!result.ok){
    if(result.message?.includes('再ログイン'))accessToken='';
    throw new Error(result.message||'処理できませんでした。');
  }
  return result.data;
 }
 let busy=false;
 let revision=null;
 function showError(error){
  busy=false;
  if(monitor&&!state.date)renderMonitorSignIn();
  else render();
  const alert=document.createElement('p');
  alert.className='aw-error';
  alert.setAttribute('role','alert');
  alert.textContent=error?.message||'通信に失敗しました。再度お試しください。';
  main.prepend(alert);
 }
 function connect(date){
  busy=true;
  render();
  request('load',{date}).then(result=>{
    data.people=result.people;
    data.front=result.front;
    tasks.forEach(task=>{
      const label=result.labels[task.id];
      task.name=task.id.startsWith('floor-')?label+' '+task.group:label;
    });
    units=makeUnits();
    revision=result.revision;
    state={...state,date,step:0,view:'attendance',attendance:uniqueAttendance(result.attendance),draft:result.assignments};
    busy=false;
    render();
  }).catch(showError);
 }
 function save(){
  if(busy)return;
  const payload={date:state.date,revision,attendance:state.attendance,assignments:state.draft};
  busy=true;
  render();
  request('save',payload).then(result=>{
    revision=result.revision;
    state.saved={date:state.date,assignments:JSON.parse(JSON.stringify(state.draft))};
    state.view='saved';
    busy=false;
    render();
  }).catch(showError);
 }
 function options(v){return availablePeople().map(p=>`<option${v===p?' selected':''}>${esc(p)}</option>`).join('');}
 function table(list,editable,assignments=state.saved?.assignments,floors=false){return `<table><thead><tr><th>${floors?'階':'業務'}</th><th>主担当</th><th>副担当</th></tr></thead><tbody>${list.map(t=>{const v=(editable?state.draft:assignments)[t.id];return `<tr><th scope="row">${esc(floors?t.name.split(' ')[0]:t.name)}</th>${['main','sub'].map(role=>`<td>${editable?`<select aria-label="${esc(t.name)}の${role==='main'?'主担当':'副担当'}" data-id="${t.id}" data-edit="${role}">${options(v[role])}</select>`:esc(v[role])}</td>`).join('')}</tr>`;}).join('')}</tbody></table>`;}
 function assignPerson(task,role,person){
  const assignment=state.draft[task];
  assignment[role]=person;
  if(role==='main'&&assignment.sub===person)assignment.sub='ーー';
 }
 const roleName=role=>role==='main'?'主担当':'副担当';
 function personList(task,role,label){
  return `<section class="aw-person-panel" data-role="${role}" aria-label="${esc(label)}"><h4 aria-live="polite">${esc(label)}</h4><div class="aw-names">${availablePeople().map(person=>{
    const selected=state.draft[task.id][role]===person;
    return `<button type="button" data-person="${esc(person)}" data-task="${task.id}" data-role="${role}" aria-pressed="${selected}">${esc(person)}</button>`;
  }).join('')}</div></section>`;
 }
 function assignmentControls(unit){
  if(unit.items.length===1){
    const [task]=unit.items;
    return ['main','sub'].map(role=>personList(task,role,roleName(role))).join('');
  }
  if(!unit.items.some(task=>task.id===target?.id))target={id:unit.items[0].id,role:'main'};
  const active=unit.items.find(task=>task.id===target.id);
  const floor=task=>task.name.split(' ')[0];
  const rows=unit.items.map(task=>`<tr data-active="${task.id===target.id}"><th scope="row">${floor(task)}</th>${['main','sub'].map(role=>{
    const selected=task.id===target.id&&role===target.role;
    return `<td><button type="button" data-slot="${task.id}" data-role="${role}" aria-label="${floor(task)}の${roleName(role)} ${esc(state.draft[task.id][role])}" aria-pressed="${selected}">${esc(state.draft[task.id][role])}</button></td>`;
  }).join('')}</tr>`).join('');
  return `<table class="aw-floor-table" data-role="${target.role}"><thead><tr><th>階</th><th data-role="main">主担当</th><th data-role="sub">副担当</th></tr></thead><tbody>${rows}</tbody></table>${personList(active,target.role,floor(active)+'の'+roleName(target.role)+'を選択中')}`;
 }
 function stepMarkers(){
  return `<span class="aw-progress" aria-hidden="true">${units.map((_,index)=>{
    const position=index===state.step?'current':index<state.step?'past':'ahead';
    return `<span class="aw-dot" data-position="${position}"></span>`;
  }).join('')}</span>`;
 }
 function renderBoard(){
  const assignments=state.saved?.assignments ?? state.draft;
  const ordinary=tasks.filter(t=>!t.id.startsWith('floor-'));
  const section=(group,list,floors=false)=>`<section><h4>${esc(group)}</h4>${table(list,false,assignments,floors)}</section>`;
  main.innerHTML=`<h3 class="aw-board-title">担当一覧</h3>
    <div class="aw-board-layout"><div class="aw-board-groups">${[...new Set(ordinary.map(t=>t.group))].map(g=>section(g,ordinary.filter(t=>t.group===g))).join('')}</div>
    <h4 class="aw-floor-title">フロア別の準備担当</h4>
    <div class="aw-board-floors">${units.filter(u=>u.items.length>1).map(u=>section(u.name,u.items,true)).join('')}</div></div>`;
 }
 const tokyoDate=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'});
 function availableDates(){
  const now=Date.now();
  return [now,now+86400000].map(value=>tokyoDate.format(value).replaceAll('/','-'));
 }
 function renderStart(){
  const dates=availableDates();
  main.innerHTML=`<h3 class="aw-start-title">対象日を選ぶ</h3><div class="aw-start-options">${['今日','明日'].map((label,index)=>`
    <button type="button" data-start="${dates[index]}"><strong>${label}</strong><span>${dates[index].replaceAll('-','/')}</span></button>
  `).join('')}</div>`;
 }
 function unavailableAssignments(){
  const candidates=new Set(availablePeople());
  return Object.values(state.draft).flatMap(assignment=>['main','sub']
    .filter(role=>!candidates.has(assignment[role])).map(role=>[assignment,role]));
 }
 function otherServiceShift(person){
  if(activeShift===frontIndex)return -1;
  return state.attendance.findIndex((list,index)=>index<frontIndex&&index!==activeShift&&list.includes(person));
 }
 function renderAttendance(){
  const [label,limit]=shifts[activeShift];
  const selected=state.attendance[activeShift];
  const roster=activeShift===frontIndex?data.front:data.people;
  main.innerHTML=`<h3 class="aw-start-title">出勤者を選ぶ</h3>
    <div class="aw-attendance">
      <div class="aw-shifts" aria-label="勤務区分">${shifts.map(([name,capacity],index)=>`
        <button type="button" data-shift="${index}" aria-pressed="${activeShift===index}"><strong>${name}</strong><span>${state.attendance[index].length} / ${capacity}名</span></button>
      `).join('')}</div>
      <section class="aw-person-panel"><h4>${label}の出勤者</h4><div class="aw-names">${roster.map((person,index)=>{
        const checked=selected.includes(person);
        const other=otherServiceShift(person);
        const disabled=other>=0||(!checked&&selected.length>=limit);
        const detail=other>=0?`<small>${shifts[other][0]}で選択済み</small>`:'';
        return `<button type="button" data-attendee="${index}" aria-pressed="${checked}" ${disabled?'disabled':''}>${esc(person)}${detail}</button>`;
      }).join('')}</div></section>
    </div>
    <div class="aw-attendance-footer">${unavailableAssignments().length?'<span>出勤者から外れた方の担当は「ーー」に戻ります。</span>':''}<button type="button" class="aw-primary" data-action="finish-attendance">業務の担当割りへ</button></div>`;
 }
 function render(){
  const board=monitor;
  root.dataset.mode=board?'board':'input';
  status.hidden=!board;
  const shownDate=(board?state.saved?.date:null)??state.date;
  date.hidden=!shownDate;
  date.textContent=shownDate?'対象日 '+shownDate.replaceAll('-','/'):'';
  date.closest('header').hidden=!board&&!shownDate;
  if(busy){main.innerHTML='<p role="status">処理中です…</p>';return;}
  if(board){


    status.textContent='閲覧専用';
    renderBoard();
    return;
  }
  if(state.view==='start'){renderStart();return;}
  if(state.view==='attendance'){renderAttendance();return;}
 if(state.view==='wizard'){const t=units[state.step];main.innerHTML=`<div class="aw-heading"><span class="aw-step" aria-live="polite">${esc(t.group)} <strong class="aw-step-count">${state.step+1} / ${units.length}</strong></span><button type="button" data-action="review">一覧で確認・修正</button></div><h3 class="aw-task-title">${esc(t.name)}</h3><div class="aw-floor-grid">${assignmentControls(t)}</div><div class="aw-footer"><button type="button" data-action="back">前へ</button>${stepMarkers()}<button type="button" class="aw-primary" data-action="next">${state.step===units.length-1?'決定して一覧へ':'決定して次へ'}</button></div>`;
 }else{const saved=state.view==='saved';const unassigned=tasks.filter(t=>(saved?state.saved.assignments:state.draft)[t.id].main==='ーー').length;main.innerHTML=`${saved?'<div class="aw-saved"><strong>スプレッドシートに保存しました</strong></div>':''}<div class="aw-heading"><div><h3 style="margin:0;font-size:21px">${saved?'確定後の担当表':'担当一覧の確認・修正'}</h3><span class="aw-step">${tasks.length}業務　／　主担当未選択 ${unassigned}件</span></div><div class="aw-actions">${saved?'<button type="button" data-action="edit">一覧を修正</button>':'<button type="button" data-action="resume">担当入力に戻る</button><button type="button" class="aw-primary" data-action="save">担当を確定</button>'}</div></div><div class="aw-review">${[groups.slice(0,2),groups.slice(2)].map(gs=>`<div>${gs.map(g=>`<section class="aw-section"><h4>${esc(g)}</h4>${table(tasks.filter(t=>t.group===g),!saved)}</section>`).join('')}</div>`).join('')}</div>`;}}
 root.addEventListener('click',e=>{
  const start=e.target.closest('[data-start]');
  if(start&&state.view==='start'){
    const chosen=start.dataset.start;
    if(!availableDates().includes(chosen)){renderStart();return;}
    connect(chosen);
    return;
  }
  const shift=e.target.closest('[data-shift]');
  if(shift&&state.view==='attendance'){
    activeShift=Number(shift.dataset.shift);
    render();
    root.querySelector('[data-shift][aria-pressed=true]')?.focus();
    return;
  }
  const attendee=e.target.closest('[data-attendee]');
  if(attendee&&state.view==='attendance'){
    const index=Number(attendee.dataset.attendee);
    const person=(activeShift===frontIndex?data.front:data.people)[index];
    const list=state.attendance[activeShift];
    if(list.includes(person))state.attendance[activeShift]=list.filter(name=>name!==person);
    else if(otherServiceShift(person)<0&&list.length<shifts[activeShift][1])list.push(person);
    render();
    root.querySelector(`[data-attendee="${index}"]`)?.focus();
    return;
  }
  const slot=e.target.closest('[data-slot]');
  if(slot){
    const {slot:id,role}=slot.dataset;
    target={id,role};
    render();
    root.querySelector(`[data-slot="${id}"][data-role="${role}"]`)?.focus();
    return;
  }
  const choice=e.target.closest('[data-person]');
  if(choice){
    const {task,role,person}=choice.dataset;
    assignPerson(task,role,person);
    render();
    root.querySelector(`[data-task="${task}"][data-role="${role}"][aria-pressed=true]`)?.focus();
    return;
  }
  const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='back'){
    if(state.step===0)state.view='attendance';
    else state.step--;
  }
  if(a==='finish-attendance'){
    for(const [assignment,role] of unavailableAssignments())assignment[role]='ーー';
    state.view='wizard';
  }if(a==='next'){if(state.step<units.length-1)state.step++;else state.view='review';}if(a==='review'||a==='edit')state.view='review';if(a==='resume')state.view='wizard';if(a==='save'){save();return;}render();});
 root.addEventListener('change',e=>{if(e.target.matches('[data-edit]')){assignPerson(e.target.dataset.id,e.target.dataset.edit,e.target.value);const oldFocus={id:e.target.dataset.id,role:e.target.dataset.edit};render();root.querySelector(`[data-id="${oldFocus.id}"][data-edit="${oldFocus.role}"]`)?.focus();}});
 function uniqueAttendance(attendance=emptyAttendance()){
  const assigned=new Set();
  return attendance.map((list,index)=>index===frontIndex?list:list.filter(person=>{
    if(assigned.has(person))return false;
    assigned.add(person);
    return true;
  }));
 }
 function renderMonitorSignIn(){
  main.innerHTML='<button type="button" class="aw-primary">Googleでログインして担当表を開く</button>';
  main.firstElementChild.addEventListener('click',()=>connect(availableDates()[0]));
 }
 if(monitor)renderMonitorSignIn();
 else render();
})();
</script>

</body></html>
